name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check functions/_lib/relay.js
          node --check scripts/build.mjs
      - name: Verify Node builder
        run: node scripts/build.mjs
      - name: Build Cloudflare Pages output
        run: sh build-cloudflare.sh
      - name: Unit tests
        run: node --test tests/*.test.mjs
      - name: Privacy invariants
        run: node scripts/check-privacy-invariants.mjs
